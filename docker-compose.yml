services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    environment:
      - BIOVOLT_ENVIRONMENT=production
      - BIOVOLT_DATABASE_URL=sqlite+aiosqlite:////data/biovolt.db
      - BIOVOLT_EXPORT_DIR=/data/exports
      - BIOVOLT_DEVICE_SHARED_TOKEN=${BIOVOLT_DEVICE_SHARED_TOKEN:?BIOVOLT_DEVICE_SHARED_TOKEN must be set in .env or the shell}
      - BIOVOLT_LOAD_RESISTANCE_OHM=${BIOVOLT_LOAD_RESISTANCE_OHM:-100000}
    volumes:
      - biovolt-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/api/health')
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "8081:8081"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  simulator:
    profiles:
      - simulator
    build:
      context: .
      dockerfile: simulator/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BIOVOLT_SIM_BACKEND_WS_URL=ws://backend:8000/ws/device
      - BIOVOLT_SIM_DEVICE_ID=biovolt-sim-01
      - BIOVOLT_SIM_CELL_ID=cell-a
      - BIOVOLT_SIM_DEVICE_TOKEN=${BIOVOLT_DEVICE_SHARED_TOKEN:?BIOVOLT_DEVICE_SHARED_TOKEN must be set in .env or the shell}
      - BIOVOLT_SIM_INTERVAL_SECONDS=0.5
      - BIOVOLT_SIM_SEED=42

  cloudflared:
    profiles:
      - public
    image: cloudflare/cloudflared:2025.8.1
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${BIOVOLT_CLOUDFLARED_TUNNEL_TOKEN:-}
    depends_on:
      nginx:
        condition: service_healthy

  frontend:
    profiles:
      - frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile

volumes:
  biovolt-data:
