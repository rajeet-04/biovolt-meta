name: Frontend

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # This is a disposable CI-only value used to satisfy Compose interpolation;
  # production credentials are supplied through the deployment environment.
  BIOVOLT_DEVICE_SHARED_TOKEN: ci-test-token

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
          cache: true

      - run: bun install --frozen-lockfile
        working-directory: frontend

      - run: bun run lint
        working-directory: frontend

      - run: bun run typecheck
        working-directory: frontend

      - run: bun run test:run
        working-directory: frontend

      - run: bun run build
        working-directory: frontend

      - run: docker compose config

      - run: docker compose build frontend
