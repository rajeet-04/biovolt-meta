name: Release Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phase9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.5"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-extras --dev --frozen

      - name: Run release validator tests
        run: uv run pytest tests/release -v

      - name: Lint release validators
        run: uv run ruff check scripts/release tests/release

      - name: Check release validator formatting
        run: uv run ruff format --check scripts/release tests/release

      - name: Run scientific release gate
        run: uv run python scripts/release/phase9_science_gate.py --root .

      - name: Run hardware-placeholder simulator smoke
        run: uv run python scripts/release/simulation_smoke.py --minutes 60 --fault light_null
