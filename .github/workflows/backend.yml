name: Backend and Simulator

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # This is a disposable CI-only value used to satisfy Compose interpolation;
  # production credentials are supplied through the deployment environment.
  BIOVOLT_DEVICE_SHARED_TOKEN: ci-test-token

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.5"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-extras --dev --frozen

      - name: Validate canonical schemas
        run: uv run python scripts/validate_schemas.py

      - name: Run Phase 0 contract tests
        run: uv run pytest tests/contracts -v

      - name: Run backend tests
        run: uv run pytest backend/tests -v

      - name: Lint backend
        run: uv run ruff check backend/src backend/tests

      - name: Check backend formatting
        run: uv run ruff format --check backend/src backend/tests

      - name: Run simulator tests
        run: uv run pytest simulator/tests -v

      - name: Lint simulator
        run: uv run ruff check simulator/src simulator/tests

      - name: Check simulator formatting
        run: uv run ruff format --check simulator/src simulator/tests

      - name: Prepare Compose environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build backend and simulator images
        run: docker compose build backend simulator
