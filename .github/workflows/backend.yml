name: Backend and Simulator

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # This is a disposable CI-only value used to satisfy Compose interpolation;
  # production credentials are supplied through the deployment environment.
  BIOVOLT_DEVICE_SHARED_TOKEN: ci-test-token

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-contracts.txt

      - name: Install contract dependencies
        run: python -m pip install -r requirements-contracts.txt

      - name: Validate canonical schemas
        run: python scripts/validate_schemas.py

      - name: Run Phase 0 contract tests
        run: python -m pytest tests/contracts -v

      - name: Install backend dependencies
        run: python -m pip install -e 'backend[dev]'

      - name: Run backend tests
        run: python -m pytest backend/tests -v

      - name: Lint backend
        run: ruff check backend/src backend/tests

      - name: Check backend formatting
        run: ruff format --check backend/src backend/tests

      - name: Install simulator dependencies
        run: python -m pip install -e 'simulator[dev]'

      - name: Run simulator tests
        run: python -m pytest simulator/tests -v

      - name: Lint simulator
        run: ruff check simulator/src simulator/tests

      - name: Check simulator formatting
        run: ruff format --check simulator/src simulator/tests

      - name: Prepare Compose environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build backend and simulator images
        run: docker compose build backend simulator
