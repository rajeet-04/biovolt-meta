[project]
name = "biovolt-workspace"
version = "0.1.0"
description = "BioVolt monorepo workspace (uv-managed)"
requires-python = ">=3.11"
dependencies = [
  "biovolt-backend",
  "biovolt-simulator",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.25,<5",
  "rfc3339-validator>=0.1.4,<1",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "httpx>=0.28,<1",
  "ruff>=0.12,<1",
]

[tool.uv.workspace]
members = ["backend", "simulator"]

[tool.uv.sources]
biovolt-backend = { workspace = true }
biovolt-simulator = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests", "simulator/tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
