server {
  listen 80;
  root /usr/share/nginx/html;
  location = /healthz { access_log off; return 200 'ok\n'; add_header Content-Type text/plain; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location /api/ { proxy_pass http://backend:8000; proxy_set_header X-BioVolt-Access-Mode operator; proxy_set_header Host $host; }
  location /ws/ { proxy_pass http://backend:8000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header X-BioVolt-Access-Mode operator; proxy_read_timeout 1h; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
